<!DOCTYPE html>
<!-- Projeto -->
<html>
  <head>
    <title> Exemplo basico </title>
    <!-- importa a biblioteca do a-frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <!-- corpo da pagina -->
<body>
  <a-scene vr-mode-ui="false">
    
    <a-assets>
      <!-- gerenciador de arquivos -->
      <a-asset-item id="modelo3d" src="main/mit.glb"></a-asset-item>  
    </a-assets>
      <!-- adicionar conteudos na cena -->
      <a-gltf-model src="modelo3d" position="0 0 -4" scale="1 1 1"></a-gltf-model>
      <!-- camera do usuario -->
      <a-camera position="0 1.6 0"> </a-camera>
  </a-scene>
</body>
</html>
