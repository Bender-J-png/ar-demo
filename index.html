<!DOCTYPE html>
<!-- Projeto -->
<html>
  <head>
    <title> MuRAL Web </title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <!-- corpo da pagina -->
<body>
  <a-scene mindar-image="imageTargetSrc: ;"
            device-orientation-device-ui="enabled"
            vr-mode-ui="false">
    
    <!-- Gerenciador de arquivos -->
    <a-assets>
      <a-asset-item id="modelo3d" src="parabolide_hiperbolico.glb"></a-asset-item>  
    </a-assets>
    
    <!-- Camera do usuario -->
    <a-camera user-camera look-controls="enabled:false"> </a-camera>

      <!-- Marcador -->
      <a-entity id="marcador" mindar-image-target="targetIndex=0">

        <!-- Modelo 3D -->
        <a-entity gltf-model="#modelo3d" position="0 0 0.2" scale="1 1 1"></a-entity>
        
      </a-entity>
    
  </a-scene>
</body>
</html>
