<!DOCTYPE html>
<html>
  <head>
    <title> MuRAL Web </title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      <!-- Gerenciador de arquivos -->
      <a-assets>
        <a-asset-item id="modelo3d0" src="./Cell.glb"></a-asset-item>
        <a-asset-item id="modelo3d1" src="./elipsoide.glb"></a-asset-item>
        <a-asset-item id="modelo3d2" src="./Mit.glb"></a-asset-item>
        <a-asset-item id="modelo3d3" src="./parabolide_hiperbolico.glb"></a-asset-item>
        <a-asset-item id="modelo3d4" src="./prisma_hexagonal_regular.glb"></a-asset-item>
      </a-assets>
      <!-- Câmera -->
      <a-camera look-controls="enabled: false"></a-camera>
      
      <!-- Marcador -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-entity gltf-model="#modelo3d0" position="0 0 0.2" scale="0.05 0.05 0.05"></a-entity>
      </a-entity>
      
      <a-entity mindar-image-target="targetIndex: 1">
        <a-entity gltf-model="#modelo3d1" position="0 0 0.2" scale="0.05 0.05 0.05"></a-entity>
      </a-entity>
      
      <a-entity mindar-image-target="targetIndex: 2">
        <a-entity gltf-model="#modelo3d3" position="0 0 0.2" scale="0.05 0.05 0.05"></a-entity>
      </a-entity>
      
      <a-entity mindar-image-target="targetIndex: 3">
        <a-entity gltf-model="#modelo3d2" position="0 0 0.2" scale="0.05 0.05 0.05"></a-entity>
      </a-entity>
      
      <a-entity mindar-image-target="targetIndex: 4">
        <a-entity gltf-model="#modelo3d4" position="0 0 0.2" scale="0.05 0.05 0.05"></a-entity>
      </a-entity>
      
    </a-scene>
  </body>
</html>
