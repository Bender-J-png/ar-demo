<!DOCTYPE html>
<!-- Projeto -->
<html>
  <head>
    <title> Exemplo basico </title>
    <!-- importa a biblioteca do a-frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <!-- corpo da pagina -->
<body>
  <a-scene vr-mode-ui="false">
    
    <!-- Gerenciador de arquivos -->
    <a-assets>
      <a-asset-item id="modelo3d" src="Cell.glb"></a-asset-item>  
    </a-assets>

    <!-- Modelo 3D -->
    <a-entity gltf-model="#modelo3d" position="0 0 -4" scale="0.6 0.6 0.6"></a-entity>
  
    <!-- Camera do usuario -->
    <a-camera position="0 1.6 0"> </a-camera>
  </a-scene>
</body>
</html>
